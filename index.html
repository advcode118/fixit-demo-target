<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Brewly Coffee - The best artisan coffee in town. Explore our espresso blends, Colombian roasts, and decaf options.">
<title>Brewly Coffee - Artisan Coffee Roasters</title>
<style>
body{font-family:Arial;background:#fff;color:#595959;margin:0}
nav{background:#eee;padding:10px;display:flex;align-items:center}
nav a{color:#0056b3;margin-right:12px}
nav a:hover,nav a:focus{color:#003d80}
.menu-btn{background:none;border:none;font-size:1.2em;cursor:pointer;padding:5px 10px;color:#333}
.hero{padding:40px;background:#f4f4f4}
.hero h1{color:#333;font-size:32px;margin-top:0}
.btn{background:#0077cc;color:#fff;padding:10px 18px;border:none;cursor:pointer}
.btn:hover,.btn:focus{background:#005fa3}
.grid{display:flex;gap:16px;padding:20px;flex-wrap:wrap}
.card{border:1px solid #ccc;padding:10px;width:30%;min-width:200px}
.card img{max-width:100%;height:auto}
footer{color:#595959;font-size:11px;padding:20px}
footer a{color:#0056b3}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
label{display:block;margin-bottom:5px;font-weight:bold;color:#333}
input[type="text"],input[type="email"]{padding:8px;margin-bottom:10px;border:1px solid #767676}
input[type="submit"]{background:#0077cc;color:#fff;padding:10px 18px;border:none;cursor:pointer}
input[type="submit"]:hover,input[type="submit"]:focus{background:#005fa3}
form{padding:0 20px 20px}
</style>
</head>
<body>
<nav aria-label="Main navigation">
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">About</a>
<button class="menu-btn" aria-label="Open menu" aria-expanded="false" onclick="alert('menu')">☰</button>
</nav>
<main>
<section class="hero">
<h1>Welcome to Brewly Coffee</h1>
<p>The best coffee in town. <a href="#">Learn more about our story</a>.</p>
<img src="https://picsum.photos/seed/coffee/800/300" alt="Fresh brewed coffee in a ceramic cup with steam rising">
<button class="btn" aria-label="Shop now">Shop Now</button>
</section>
<section>
<h2>Our Products</h2>
<div class="grid">
<article class="card"><img src="https://picsum.photos/seed/bean1/300/200" alt="Dark roasted espresso coffee beans"><p>Espresso Blend</p></article>
<article class="card"><img src="https://picsum.photos/seed/bean2/300/200" alt="Colombian single-origin coffee beans"><p>Colombian Roast</p></article>
<article class="card"><img src="https://picsum.photos/seed/bean3/300/200" alt="Decaffeinated house blend coffee beans"><p>Decaf House</p></article>
</div>
</section>
<section>
<h2>Join Our Newsletter</h2>
<form>
<div>
<label for="name">Name</label>
<input type="text" id="name" name="name" placeholder="Your name" autocomplete="name">
</div>
<div>
<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="Your email" autocomplete="email">
</div>
<input type="submit" value="Subscribe">
</form>
</section>
</main>
<footer>
<p>© 2026 Brewly. <a href="#">View our privacy policy</a></p>
</footer>
</body>
</html>
